<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backlog ASP</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="marca"><b>Backlog ASP</b><span>Ingram Micro Colombia</span></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="casos" aria-selected="true">Casos</button>
      <button role="tab" data-tab="guias" aria-selected="false">Guías</button>
      <button role="tab" data-tab="partes" aria-selected="false">Abastecimiento</button>
      <button role="tab" data-tab="correos" aria-selected="false">Correos</button>
      <button role="tab" data-tab="indicadores" aria-selected="false">Indicadores</button>
      <button role="tab" data-tab="cargas" aria-selected="false">Cargas</button>
      <button role="tab" data-tab="admin" aria-selected="false" hidden id="tab-admin">Administración</button>
    </nav>
    <div class="usuario"><span id="quien"></span><button id="salir" type="button">Salir</button></div>
  </header>
  <div class="fuentes" id="fuentes"></div>
  <main>
    <section class="vista" id="v-casos"></section>
    <section class="vista" id="v-guias" hidden></section>
    <section class="vista" id="v-partes" hidden></section>
    <section class="vista" id="v-correos" hidden></section>
    <section class="vista" id="v-indicadores" hidden></section>
    <section class="vista" id="v-cargas" hidden></section>
    <section class="vista" id="v-admin" hidden></section>
  </main>
  <div id="aviso" role="status" hidden></div>
</body>
</html>
